name: CI

on:
  push:
    branches: [main]
  pull_request:

# No Kraken in CI: this checks that the code compiles and renders a preview from fixed sample data.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile tram_lcd.py
      - run: python tram_lcd.py --help
      - name: Render preview
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import time, tram_lcd as t
          t.CFG = t.Config.load("config.example.toml")  # example config must stay valid
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          rows = [{"line": "42", "towards": "Antonigasse", "times": [now + timedelta(minutes=m) for m in (0, 9)]},
                  {"line": "9", "towards": "Westbahnhof S U", "times": [now + timedelta(minutes=m) for m in (3, 11)]}]
          s = time.time()
          frames, _ = t.Animator().build(rows, s, None, s, s + 10, s + 10)
          assert len(frames) == 48, len(frames)  # 10 s + 2 s margin at 0.25 s per frame
          frames[0].save("preview.png")
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview.png
